<title>English Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--FONTS-->
<style>
/* Layout: one phone column. Persistent stats bar on top, five tabs at the bottom; sessions and lessons go full-screen ("focus").
   Look: warm, playful, tactile — chunky 3D buttons, a mango mascot, five juicy accents on a warm paper ground. */
:root{
  --bg:#FFF5E8; --sunk:#FBE8D0; --surface:#FFFFFF; --ink:#2B1D3F; --muted:#7D6C8A; --line:#F0DEC6;
  --mango:#FFAE1F; --mango-d:#DB8600; --mango-s:#FFE8BC; --mango-t:#B86E00;
  --coral:#FF5468; --coral-d:#D1304A; --coral-s:#FFDDE1; --coral-t:#C42A43;
  --grape:#7856F5; --grape-d:#5434D2; --grape-s:#E7E0FF; --grape-t:#5434D2;
  --leaf:#17A866; --leaf-d:#0E7F4B; --leaf-s:#D2F2E0; --leaf-t:#0E7F4B;
  --sky:#1E90F0; --sky-d:#106DBE; --sky-s:#D6EBFF; --sky-t:#106DBE;
  --on:#FFFFFF; --on-mango:#3A2200; --shadow:rgba(90,50,10,.14); --scrim:rgba(30,15,40,.45);
  --f:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17112A; --sunk:#221A39; --surface:#2A2145; --ink:#FBF6FF; --muted:#B5A8CE; --line:#3A2E5A;
  --mango:#FFB838; --mango-d:#B97300; --mango-s:#3E2F16; --mango-t:#FFC861;
  --coral:#FF6274; --coral-d:#B82A40; --coral-s:#43202D; --coral-t:#FF8C9A;
  --grape:#8E72FF; --grape-d:#5B3CD6; --grape-s:#2F2559; --grape-t:#B5A2FF;
  --leaf:#1FB872; --leaf-d:#0F7D4A; --leaf-s:#153A2C; --leaf-t:#5BE0A2;
  --sky:#2C98F2; --sky-d:#1466AE; --sky-s:#16304B; --sky-t:#7CC2FF;
  --shadow:rgba(0,0,0,.4); --scrim:rgba(5,2,12,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17112A; --sunk:#221A39; --surface:#2A2145; --ink:#FBF6FF; --muted:#B5A8CE; --line:#3A2E5A;
  --mango:#FFB838; --mango-d:#B97300; --mango-s:#3E2F16; --mango-t:#FFC861;
  --coral:#FF6274; --coral-d:#B82A40; --coral-s:#43202D; --coral-t:#FF8C9A;
  --grape:#8E72FF; --grape-d:#5B3CD6; --grape-s:#2F2559; --grape-t:#B5A2FF;
  --leaf:#1FB872; --leaf-d:#0F7D4A; --leaf-s:#153A2C; --leaf-t:#5BE0A2;
  --sky:#2C98F2; --sky-d:#1466AE; --sky-s:#16304B; --sky-t:#7CC2FF;
  --shadow:rgba(0,0,0,.4); --scrim:rgba(5,2,12,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;font-weight:600;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.ic{width:24px;height:24px;flex:none}
h1,h2,h3{font-weight:900;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.08}
h2{font-size:22px;line-height:1.15}
h3{font-size:18px}
p{margin:0}
.sub{color:var(--muted);font-size:15px;font-weight:600}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
body.focus .app{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
body.fbopen .app{padding-bottom:260px}
section[data-tab]{display:flex;flex-direction:column;gap:20px;padding-top:4px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.link{color:var(--grape-t);font-weight:800;font-size:15px}

/* top stats bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .ic{width:20px;height:20px}
.chip.fire{color:var(--coral-t)} .chip.fire.off{color:var(--muted)}
.chip.xp{color:var(--grape-t)}
.chip.lv{color:var(--mango-t)}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:0 3px 0 var(--line);color:var(--muted)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
body.focus .top,body.focus nav.tabs{display:none}

/* surfaces */
.card{background:var(--surface);border-radius:24px;padding:18px;box-shadow:0 4px 0 var(--line),0 14px 28px -20px var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800;background:var(--sunk);color:var(--muted)}
.pill .ic{width:16px;height:16px}
.t-mango{--tc:var(--mango-t);--ts:var(--mango-s);--tb:var(--mango);--td:var(--mango-d)}
.t-coral{--tc:var(--coral-t);--ts:var(--coral-s);--tb:var(--coral);--td:var(--coral-d)}
.t-grape{--tc:var(--grape-t);--ts:var(--grape-s);--tb:var(--grape);--td:var(--grape-d)}
.t-leaf{--tc:var(--leaf-t);--ts:var(--leaf-s);--tb:var(--leaf);--td:var(--leaf-d)}
.t-sky{--tc:var(--sky-t);--ts:var(--sky-s);--tb:var(--sky);--td:var(--sky-d)}
.pill[class*="t-"]{background:var(--ts);color:var(--tc)}
.tile{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--ts);color:var(--tc)}
.tile .ic{width:26px;height:26px}
.tile.lg{width:56px;height:56px;border-radius:18px}
.tile.lg .ic{width:30px;height:30px}

/* chunky 3D buttons */
.btn{--c:var(--grape);--cd:var(--grape-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 20px;border-radius:18px;background:var(--c);color:var(--on);font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--cd);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.btn.block{width:100%}
.btn.mango{--c:var(--mango);--cd:var(--mango-d);color:var(--on-mango)}
.btn.leaf{--c:var(--leaf);--cd:var(--leaf-d)}
.btn.coral{--c:var(--coral);--cd:var(--coral-d)}
.btn.sky{--c:var(--sky);--cd:var(--sky-d)}
.btn.ghost{--c:var(--surface);--cd:var(--line);color:var(--ink)}
.btn.small{min-height:42px;padding:8px 14px;font-size:15px;border-radius:14px;box-shadow:0 4px 0 var(--cd)}
.btn:disabled{--c:var(--sunk);--cd:var(--line);color:var(--muted);cursor:default}
.btn .ic{width:22px;height:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .btn{flex:1}
.spk{width:52px;height:52px;border-radius:18px;background:var(--sky);color:#fff;box-shadow:0 4px 0 var(--sky-d);display:grid;place-items:center;flex:none}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-d)}
.spk.sm{width:38px;height:38px;border-radius:13px;box-shadow:0 3px 0 var(--sky-d)}
.spk.sm .ic{width:20px;height:20px}

/* mascot + bubble */
.mascot{display:block;flex:none;overflow:visible}
.mascot.bob{animation:bob 3.4s ease-in-out infinite;transform-origin:50% 95%}
.mascot.jump{animation:jump .8s cubic-bezier(.3,1.6,.5,1) 2;transform-origin:50% 95%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-18px) scale(1.04,.96)}}
.hero{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border-radius:22px 22px 22px 8px;padding:14px 16px;box-shadow:0 4px 0 var(--line);margin-bottom:22px;display:flex;flex-direction:column;gap:2px}
.bubble b{font-size:19px;font-weight:900}
.bubble span{color:var(--muted);font-weight:700}

/* today */
.goal{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring>svg{width:100%;height:100%;display:block}
.ring>svg circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .rb{stroke:var(--sunk)}
.ring .rf{stroke:var(--mango);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring.full .rf{stroke:var(--leaf)}
.ring .ri{position:absolute;inset:0;display:grid;place-items:center;color:var(--mango)}
.ring.full .ri{color:var(--leaf)}
.ring .ri .ic{width:34px;height:34px}
.goal .gx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.goal .num{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.goal .num small{font-size:16px;color:var(--muted);font-weight:800}
.plan{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.task:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.task .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.task b{font-size:17px;font-weight:900;line-height:1.25}
.task small{color:var(--muted);font-size:14px;font-weight:700}
.check{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.check .ic{width:18px;height:18px;stroke-width:3.2}
.task.done .check{background:var(--leaf);border-color:var(--leaf);color:#fff;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.lvlcard{display:flex;flex-direction:column;gap:10px}
.lvlcard .row{justify-content:space-between}
.lvbadge{width:52px;height:52px;border-radius:50%;background:var(--mango);color:var(--on-mango);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 4px 0 var(--mango-d);flex:none}
.bar{height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--tb,var(--leaf));transition:width .7s cubic-bezier(.2,.8,.2,1);min-width:0}
.bar.thin{height:8px}
.badges{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.bdg{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bdg small{font-size:12px;font-weight:800;line-height:1.2;color:var(--muted)}
.medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);position:relative}
.medal .ic{width:30px;height:30px}
.medal.on{background:var(--tb);color:#fff;box-shadow:0 4px 0 var(--td)}
.medal.on::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(255,255,255,.4)}
.medal:not(.on) .ic{opacity:.55}

/* words */
.study{display:flex;flex-direction:column;gap:14px}
.study .hero{margin:-4px 0 -6px}
.study .bubble{margin-bottom:16px;box-shadow:none;background:var(--sunk)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic{text-align:left;background:var(--surface);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .08s,box-shadow .08s}
.topic:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.topic .nm{font-weight:900;font-size:15.5px;line-height:1.2}
.topic small{color:var(--muted);font-size:13px;font-weight:700}
.wl{display:flex;flex-direction:column}
.wl .w{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--line)}
.wl .w:first-child{border-top:0}
.wl .w .tx{flex:1;min-width:0}
.wl .w b{display:block;font-weight:900}
.wl .w span{color:var(--muted);font-size:14px}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--leaf)}

/* focus mode: session + lesson head */
.shead{display:flex;align-items:center;gap:12px;padding:14px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x .ic{width:26px;height:26px;stroke-width:2.6}
.pbar{flex:1;height:18px;border-radius:99px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--leaf);border-radius:inherit;transition:width .4s cubic-bezier(.2,.8,.2,1);position:relative;min-width:18px}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.4)}
.shead .cnt{font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}

/* flashcard */
.flipwrap{perspective:1400px}
.flipwrap.in{animation:cardin .35s cubic-bezier(.2,1.3,.4,1)}
.flipwrap.out{animation:cardout .2s ease-in forwards}
@keyframes cardin{from{transform:translateX(40px) rotate(3deg);opacity:0}}
@keyframes cardout{to{transform:translateX(-50px) rotate(-5deg);opacity:0}}
.flip{position:relative;height:min(62vh,430px);min-height:340px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.25,.45,1);cursor:pointer}
.flip.flipped{transform:rotateY(180deg);cursor:default}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:30px;padding:20px;box-shadow:0 6px 0 var(--line),0 22px 40px -24px var(--shadow);display:flex;flex-direction:column;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.flip:not(.flipped) .back,.flip.flipped .front{pointer-events:none}
.face .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.fc-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.word{font-weight:900;font-size:clamp(34px,10vw,46px);line-height:1.05;letter-spacing:-.015em;overflow-wrap:anywhere}
.word.md{font-size:clamp(26px,7.5vw,34px)}
.ipa{color:var(--muted);font-weight:700;font-size:17px}
.hint{color:var(--muted);font-size:14px;font-weight:700;text-align:center;display:flex;gap:6px;align-items:center;justify-content:center}
.hint .ic{width:18px;height:18px}
.exbox{background:var(--sunk);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.exbox p{flex:1;min-width:0;font-weight:800}
.exbox p small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grades .btn{flex-direction:column;gap:0;min-height:66px;padding:8px 6px;font-size:16px;line-height:1.15}
.grades small{font-weight:800;font-size:11.5px;opacity:.92}
.stage{display:flex;flex-direction:column;gap:18px}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:24px}
.result .row{width:100%}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--tb);color:#fff;box-shadow:0 4px 0 var(--td)}
.stat b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;font-weight:800;opacity:.95}
.t-mango.stat{color:var(--on-mango)}

/* lessons map */
.unit{border-radius:22px;padding:16px 18px;background:var(--tb);color:#fff;box-shadow:0 5px 0 var(--td);display:flex;align-items:center;gap:12px}
.unit.t-mango{color:var(--on-mango)}
.unit .tx{flex:1;min-width:0}
.unit b{display:block;font-size:19px;font-weight:900}
.unit small{font-weight:800;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding:18px 0 26px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:160px;transform:translateX(var(--dx,0))}
.node .nb{width:78px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);box-shadow:0 7px 0 var(--line);font-weight:900;font-size:24px;transition:transform .08s,box-shadow .08s}
.node:active .nb{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.node.done .nb{background:var(--leaf);color:#fff;box-shadow:0 7px 0 var(--leaf-d)}
.node.cur .nb{background:var(--mango);color:var(--on-mango);box-shadow:0 7px 0 var(--mango-d);animation:pulse 1.8s ease-in-out infinite}
.node .nb .ic{width:32px;height:32px}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 var(--mango-d),0 0 0 0 rgba(255,174,31,.45)}50%{box-shadow:0 7px 0 var(--mango-d),0 0 0 12px rgba(255,174,31,0)}}
.node .nm{font-weight:900;font-size:14px;text-align:center;line-height:1.2}
.node.cur .nm::before{content:"Сейчас: ";color:var(--mango-t)}
.stars{display:flex;gap:2px}
.stars .ic{width:17px;height:17px;color:var(--line)}
.stars .ic.on{color:var(--mango)}
.bigstars{display:flex;gap:10px;align-items:flex-end}
.bigstars .ic{width:56px;height:56px;color:var(--line)}
.bigstars .ic:nth-child(2){width:72px;height:72px}
.bigstars .ic.on{color:var(--mango);animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both}
.bigstars .ic.on:nth-child(2){animation-delay:.18s}
.bigstars .ic.on:nth-child(3){animation-delay:.36s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}

/* lesson */
.theory{display:flex;flex-direction:column;gap:12px}
.theory p{font-weight:600}
.formula{background:var(--grape-s);color:var(--grape-t);border-radius:16px;padding:12px 14px;font-weight:900;line-height:1.7}
.exs{display:flex;flex-direction:column;gap:10px}
.exs div{display:flex;gap:12px;align-items:center}
.exs p{font-weight:800}
.exs p small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.qtitle{font-size:24px;font-weight:900;line-height:1.25}
.qkind{color:var(--grape-t);font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{width:100%;text-align:left;padding:16px 18px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:17px;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--leaf-s);border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf);color:var(--leaf-t)}
.opt.wrong{background:var(--coral-s);border-color:var(--coral);box-shadow:0 4px 0 var(--coral);color:var(--coral-t);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.build{min-height:120px;border-bottom:2px solid var(--line);padding:6px 0 14px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 0}
.tok{padding:10px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:17px}
.tok:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tok.ghost{visibility:hidden}

function confetti(){

    const d=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*d;c.height=H*d;const x=c.getContext("2d");x.scale(d,d);
    const cs=getComputedStyle(document.documentElement),cols=["mango","coral","grape","leaf","sky"].map(v=>cs.getPropertyValue("--"+v).trim()||"#FFAE1F");

    let last=performance.now();const end=last+2600;
    (function f(now){const dt=Math.min(32,now-last)/16;last=now;x.clearRect(0,0,W,H);let alive=0;
      P.forEach(p=>{p.vy+=.38*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;if(p.y<H+20)alive++;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startSession(topic){
  const t=today(),inT=c=>!topic||topic==="all"||c.cat===topic;
  const due=shuffle(deck().filter(c=>inT(c)&&S.cards[c.id]&&S.cards[c.id].due<=t));
  const fresh=deck().filter(c=>inT(c)&&!S.cards[c.id]).slice(0,newLeft());
  SES={queue:[...due,...fresh],i:0,total:due.length+fresh.length,shown:false,good:0,xp:0,lock:false,said:-1,fin:false};
  closeSheet();
  if(TAB!=="words")go("words");else{renderWords();syncFocus();window.scrollTo({top:0})}
}
function grade(g){
  const c=SES.queue[SES.i],t=today(),st=S.cards[c.id];
  if(!st){if(S.newDay!==t){S.newDay=t;S.newCount=0}S.newCount++}
  let b=st?st.b:0,due;
  if(g==="again"){b=0;due=t;SES.queue.push(c)}
  else if(g==="hard"){b=Math.max(1,b);due=t+1}
  else{b=Math.min(6,b+1);due=t+INT[b];SES.good++}
  S.cards[c.id]={b,due};
  if(S.cardsDay!==t){S.cardsDay=t;S.cardsToday=0}
  S.cardsToday++;
  const xp={good:10,hard:6,again:2}[g]||0;SES.xp+=xp;addXP(xp);
  SES.i++;SES.shown=false;SES.lock=false;
  renderWords();
}
function fmtInt(b){const d=INT[b];return d===1?"через день":`через ${d} ${plural(d,"день","дня","дней")}`}

const starsOf=(sc,tot)=>sc==null?0:sc>=tot?3:sc>=tot-1?2:sc>=tot-3?1:0;
const starRow=(n,cls="stars")=>`<span class="${cls}">${[0,1,2].map(i=>ic("starf",i<n?"on":"")).join("")}</span>`;
function newBuild(item){
  const words=item.b.split(" ");let pool=words.map((w,i)=>({w,i}));
  if(words.length>1){let k=0;do{shuffle(pool);k++}while(k<10&&pool.every((p,j)=>p.i===j))}
  return {pool,picked:[]};
}
function startLesson(i){LES={i,step:"theory",qi:0,picked:null,score:0,bd:null,xp:0,fin:false};if(TAB!=="grammar")go("grammar");else{renderGrammar();syncFocus();window.scrollTo({top:0})}}
function prepQ(){const it=LESSONS[LES.i].q[LES.qi];LES.picked=null;LES.bd=(it&&!Array.isArray(it))?newBuild(it):null}
function finishQ(ok){if(ok){LES.score++;LES.xp+=5;addXP(5)}sfx(ok?"ok":"bad")}
const PRAISE=["Отлично!","Верно!","Так держать!","Идеально!","Супер!","Точно!"];

  }
  el.innerHTML=head+`<div class="stage">${body}</div>`;

/* ---------------- AI CHAT (when a backend or Claude is available) ---------------- */
let SAMPLE=null,CH=null,CHPICK=false,AUTO_SPEAK=true;
function rulesFor(sc){
  return `You are an English conversation partner for a Russian-speaking learner at a beginner level (A1-A2, knows basic English).
Scenario: ${sc.role}
Rules:
- Use very simple English: short sentences, common everyday words, 1-2 sentences per reply. Ask one simple question at a time so the conversation keeps going. Stay in your role.
- If the learner writes in Russian or mixes languages, keep the conversation going and show them in "better" how to say it in English.
- Corrections are about the learner's LAST message only. Explain mistakes briefly and kindly in Russian (1-2 sentences). Ignore missing capital letters and final punctuation.
Reply with ONLY a JSON object, no other text:
{"reply": "your reply in English", "reply_ru": "Russian translation of your reply", "correction": "short explanation of mistakes in Russian, or empty string if there were none or there is no learner message yet", "better": "the learner's last message rewritten in correct natural English, or empty string if it was already correct or there is no learner message yet", "hint": "one short example of what the learner could answer next, in simple English"}`;
}
async function askTutor(){
  if(!SAMPLE)return;
  CH.busy=true;CH.err="";renderChat();
  const input=[{role:"user",content:rulesFor(CH.sc)}],turns=CH.turns.slice(-20);
  if(turns.length===0)input.push({role:"user",content:"(Start the conversation now.)"});else input.push(...turns);
  try{
    const r=await SAMPLE.json(input,{cache:false,modelTier:"quick"});
    const reply=String(r&&r.reply||"").trim();
    if(!reply)throw {code:"invalid_json"};
    const lastMe=[...CH.view].reverse().find(m=>m.me);
    if(lastMe&&!lastMe.checked){
      lastMe.checked=true;lastMe.corr=String(r.correction||"").trim();lastMe.better=String(r.better||"").trim();
      if(S.chatDay!==today())S.chatDay=today();addXP(5);
    }
    CH.view.push({me:false,text:reply,ru:String(r.reply_ru||"").trim(),showRu:false});
    CH.turns.push({role:"assistant",content:reply});
    CH.hint=String(r.hint||"").trim();CH.showHint=false;
    if(AUTO_SPEAK)speak(reply);
  }catch(e){
    const c=e&&e.code;
    if(e&&e.ru){CH.err=e.ru;if(e.fatal)SAMPLE=null}
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){SAMPLE=null;CH.err="Разговор с ИИ недоступен: доступ к Claude для этой страницы не разрешён."}
    else if(c==="rate_limited")CH.err="Слишком много сообщений подряд. Подожди немного и отправь снова.";
    else if(c==="session_expired")CH.err="Сессия истекла — войди заново.";
    else CH.err="Не получилось получить ответ. Нажми «Отправить» ещё раз.";
  }
  CH.busy=false;renderChat();
}
function renderChat(){
  const el=$("#tab-dialogs");
  if(!CH){
    el.innerHTML=`<button class="backlink" data-act="dlgBack">${ic("back")}Диалоги</button>
      <div class="hero">${mascot("wave",88)}<div class="bubble"><b>Поболтаем?</b><span>Выбери ситуацию. Пиши как получается, можно вперемешку с русским — я поправлю.</span></div></div>
      <div class="scen">${SCENARIOS.map((s,i)=>`<button class="topic t-${SC_COL[i]}" data-act="scen" data-i="${i}"><span class="tile">${ic(SC_IC[i])}</span><span class="nm">${esc(s.t)}</span><small>${esc(s.d)}</small></button>`).join("")}</div>`;
    return;
  }
  const draft=(document.getElementById("msgIn")||{}).value||"",parts=[];
  CH.view.forEach((m,i)=>{
    if(m.me){
      parts.push(`<div class="msg me">${esc(m.text)}</div>`);
      if(m.checked){
        if(m.better||m.corr)parts.push(`<div class="corr"><b>Как лучше</b>${m.better?`<div class="better">${esc(m.better)}</div>`:""}${m.corr?`<div>${esc(m.corr)}</div>`:""}</div>`);
        else parts.push(`<div class="corr okc"><b>Без ошибок</b></div>`);
      }
    } else parts.push(`<div class="msg ai">${esc(m.text)}${m.showRu&&m.ru?`<div class="ru">${esc(m.ru)}</div>`:""}<div class="msg-actions"><button data-say="${esc(m.text)}">${ic("spk")}Слушать</button>${m.ru?`<button data-act="chatRu" data-i="${i}">${ic("lang")}${m.showRu?"Скрыть":"Перевод"}</button>`:""}</div></div>`);
  });
  if(CH.busy)parts.push(`<div class="thinking">Манго печатает</div>`);
  el.innerHTML=`
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="sheet-h" style="flex:1;min-width:0">${mascot("happy",52,"")}<div class="tx"><span class="qkind">Разговор с ИИ</span><h2>${esc(CH.sc.t)}</h2></div></div><button class="btn ghost small" data-act="endChat">Сменить</button></div>
    <div class="chat" id="chatLog">${parts.join("")}</div>
    ${CH.err?`<p class="err">${esc(CH.err)}</p>`:""}
    <div class="composer">
      ${CH.hint&&CH.showHint?`<div class="hintbox"><span>${esc(CH.hint)}</span><button class="btn small ghost" data-act="useHint">Вставить</button></div>`:""}
      <div class="comp-row"><textarea id="msgIn" rows="1" placeholder="Напиши по-английски…" ${CH.busy||!SAMPLE?"disabled":""}>${esc(draft)}</textarea>
        <button class="btn grape" data-act="send" ${CH.busy||!SAMPLE?"disabled":""} aria-label="Отправить">${ic("arrow")}</button></div>
      <div class="row" style="justify-content:space-between">${CH.hint?`<button class="link" data-act="hint">${CH.showHint?"Скрыть подсказку":"Подсказка: что ответить"}</button>`:"<span></span>"}
        <label class="tgl"><input type="checkbox" id="autoSp" ${AUTO_SPEAK?"checked":""}> Озвучивать</label></div>
    </div>`;
  const last=$("#chatLog").lastElementChild;if(last&&TAB==="dialogs")last.scrollIntoView({block:"nearest"});
}
function sendChat(){
  const inp=$("#msgIn");if(!inp||!CH||CH.busy)return;
  const v=inp.value.trim();if(!v)return;
  CH.view.push({me:true,text:v});CH.turns.push({role:"user",content:v});inp.value="";CH.showHint=false;askTutor();
}

/* ---------------- SETTINGS & ACHIEVEMENTS SHEETS ---------------- */
function settingsSheet(){
  const seg=(k,vals)=>`<div class="seg" role="group">${vals.map(([v,l])=>`<button data-act="set" data-k="${k}" data-v="${v}" aria-pressed="${String(S[k])===String(v)}">${l}</button>`).join("")}</div>`;
  return `<h2>Настройки</h2>
    <div class="field"><span class="flabel">Цель дня</span>${seg("goal",[[30,"30 XP"],[50,"50 XP"],[100,"100 XP"]])}</div>
    <div class="field"><span class="flabel">Новых слов в день</span>${seg("perDay",[[5,"5"],[10,"10"],[15,"15"],[20,"20"]])}</div>
    <div class="field"><span class="flabel">Карточки</span>${seg("dir",[["en","English → рус"],["ru","Рус → English"]])}</div>
    <div class="field"><span class="flabel">Звуки успеха</span>${seg("sound",[["true","Вкл"],["false","Выкл"]])}</div>
    <button class="btn ghost block" data-act="closeSheet">Готово</button>`;
}
const achSheet=()=>`<h2>Награды</h2><p class="sub">Получено ${Object.keys(S.ach).length} из ${ACH.length}</p>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">${ACH.map(a=>`<div class="achrow">${medal(a,!!S.ach[a.id])}<div class="tx"><b>${esc(a.t)}</b><span>${esc(a.d)}</span></div>${S.ach[a.id]?`<span class="pill t-leaf">${ic("check")}</span>`:""}</div>`).join("")}</div>`;

/* ---------------- ACTIONS (one delegated click handler) ---------------- */
const ACT={
  go:el=>go(el.dataset.t),
  settings:()=>openSheet(settingsSheet()),
  closeSheet:()=>closeSheet(),
  set:el=>{const k=el.dataset.k,v=el.dataset.v;S[k]=k==="dir"?v:k==="sound"?v==="true":+v;save();setSheet(settingsSheet());renderTop();renderTab(TAB);syncFocus()},
  achs:()=>openSheet(achSheet()),
  study:()=>startSession("all"),
  topic:el=>openSheet(topicSheet(el.dataset.k)),
  studyTopic:el=>startSession(el.dataset.k),
  addWord:()=>openSheet(addWordSheet()),
  reveal:()=>{
    if(!SES||SES.shown)return;SES.shown=true;sfx("tap");
    $("#flip").classList.add("flipped");$("#ctl").innerHTML=ctlHtml();
    const c=SES.queue[SES.i];if(S.dir==="ru")speak(c.en);
  },
  grade:el=>{
    if(!SES||SES.lock)return;SES.lock=true;
    const g=el.dataset.g;floatXP(el,{good:10,hard:6,again:2}[g]);sfx(g==="again"?"bad":"ok");
    const fw=$("#fw");
    if(reduced()||!fw)return grade(g);
    fw.classList.remove("in");fw.classList.add("out");setTimeout(()=>grade(g),190);
  },
  endSes:()=>{SES=null;renderWords();syncFocus();renderTop();window.scrollTo({top:0})},
  lesson:el=>startLesson(+el.dataset.i),
  toQ:()=>{LES.step="q";LES.qi=0;prepQ();renderLesson();window.scrollTo({top:0})},
  opt:el=>{
    if(!LES||LES.picked!=null)return;const it=LESSONS[LES.i].q[LES.qi];
    LES.picked=+el.dataset.o;finishQ(LES.picked===it[2]);renderLesson();
  },
  pick:el=>{if(LES.picked!=null)return;LES.bd.picked.push(+el.dataset.k);renderLesson()},
  unpick:el=>{if(LES.picked!=null)return;LES.bd.picked.splice(+el.dataset.k,1);renderLesson()},
  checkBuild:()=>{
    const it=LESSONS[LES.i].q[LES.qi],got=LES.bd.picked.map(pi=>LES.bd.pool[pi].w).join(" ");
    const norm=s=>s.toLowerCase().replace(/[.,!?]/g,"").trim(),ok=norm(got)===norm(it.b);
    LES.picked=ok;finishQ(ok);renderLesson();speak(it.b);
  },
  nextQ:()=>{
    const L=LESSONS[LES.i];hideFb();LES.qi++;
    if(LES.qi>=L.q.length){
      LES.step="done";S.grammar[LES.i]=Math.max(S.grammar[LES.i]||0,LES.score);S.lessonDay=today();
      const bonus=20+(LES.score===L.q.length?10:0);LES.xp+=bonus;addXP(bonus);
    } else prepQ();
    renderLesson();window.scrollTo({top:0});
  },
  retryLesson:()=>startLesson(LES.i),
  nextLesson:()=>startLesson(LES.i+1),
  endLesson:()=>{LES=null;hideFb();renderGrammar();syncFocus();window.scrollTo({top:0})},
  pcat:el=>{PCAT=+el.dataset.i;renderPhrases()},
  addPhrase:el=>{
    const [en,ru]=el.dataset.p.split("|");
    if(!deck().some(c=>c.en===en)){S.custom.unshift({id:"p:"+en,en,ru,ipa:"",ex:"",exru:"",cat:"my"});save()}
    el.disabled=true;el.innerHTML=ic("check");sfx("tap");renderTabs();
  },
  dialog:el=>openDialog(+el.dataset.i),
  dlgBack:()=>{playToken++;stopSpeech();DLG=null;CH=null;CHPICK=false;renderDialogs();window.scrollTo({top:0})},
  tgRu:()=>{DOPT.ru=!DOPT.ru;renderDialogs()},
  tgPr:()=>{DOPT.practice=!DOPT.practice;DOPT.shown={};renderDialogs()},
  line:el=>{
    const i=+el.dataset.i,D=DIALOGS[DLG],[who,en]=D.l[i];
    if(DOPT.practice&&who==="me"&&!DOPT.shown[i]){
      DOPT.shown[i]=true;
      const allShown=D.l.every(([w],k)=>w!=="me"||DOPT.shown[k]);
      if(allShown&&!DOPT.awarded){DOPT.awarded=true;S.dlg[DLG]=true;S.dialogDay=today();addXP(15);
        setTimeout(()=>{confetti();sfx("win");queueToast(`<span class="medal on t-${DLG_COL[DLG]}">${ic(DLG_IC[DLG])}</span><div><b>Диалог пройден!</b><small>+15 XP</small></div>`)},250)}
      renderDialogs();
    }
    playToken++;speak(en);
  },
  playAll:()=>{
    const D=DIALOGS[DLG];
    speakSeq(D.l.map(([who,en])=>({text:en,pitch:who==="me"?1.15:.9})),i=>{PLAYING=i;document.querySelectorAll("#tab-dialogs .line").forEach(n=>n.classList.toggle("playing",+n.dataset.li===i))},()=>{PLAYING=-1});
  },
  chat:()=>{CHPICK=true;CH=null;if(TAB!=="dialogs")go("dialogs");else{renderDialogs();window.scrollTo({top:0})}},
  scen:el=>{if(!SAMPLE)return;CH={sc:SCENARIOS[+el.dataset.i],turns:[],view:[],busy:false,hint:"",showHint:false,err:""};askTutor()},
  endChat:()=>{CH=null;renderChat()},
  chatRu:el=>{const m=CH.view[+el.dataset.i];m.showRu=!m.showRu;renderChat()},
  send:()=>sendChat(),
  hint:()=>{CH.showHint=!CH.showHint;renderChat()},
  useHint:()=>{const h=CH.hint;CH.showHint=false;renderChat();const i=$("#msgIn");if(i){i.value=h;i.focus()}},
};
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-say]");
  if(s){e.preventDefault();e.stopPropagation();playToken++;speak(s.getAttribute("data-say"));return}
  const a=e.target.closest("[data-act]");
  if(a&&!a.disabled&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a,e)}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="addForm")return;e.preventDefault();
  const en=$("#addEn").value.trim(),ru=$("#addRu").value.trim(),ex=$("#addEx").value.trim();
  if(!en||!ru)return;
  if(deck().some(c=>c.en.toLowerCase()===en.toLowerCase())){setSheet(addWordSheet(`<p class="err">Это слово уже есть в карточках.</p>`));return}
  S.custom.unshift({id:"c:"+Date.now().toString(36),en,ru,ipa:"",ex,exru:"",cat:"my"});save();sfx("ok");
  setSheet(addWordSheet(`<p class="okmsg">«${esc(en)}» добавлено. Добавить ещё?</p>`));renderTabs();if(TAB==="words")renderWords();
});
document.addEventListener("keydown",e=>{if(e.target&&e.target.id==="msgIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat()}});
document.addEventListener("input",e=>{if(e.target&&e.target.id==="msgIn"){const t=e.target;t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"}});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="autoSp")AUTO_SPEAK=e.target.checked});

/* ---------------- BOOT ---------------- */
function renderAll(){renderTop();renderTab(TAB);syncFocus()}
renderAll();

if(!IS_APP&&window.claude&&window.claude.use){
  claude.use("sample").then(s=>{SAMPLE=s||null;if(TAB==="today")renderToday();if(!CH&&!CHPICK&&DLG===null&&TAB==="dialogs")renderDialogs()}).catch(()=>{});
  (async()=>{
    try{
      const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
      if(!user||!db)return;
      const id=await user.id();if(!id)return;
      const ref=db.doc("data/users/"+id+"/progress");
      const snap=await ref.get();
      remoteRef=ref;
      const rs=snap.exists?(snap.data()||{}).state:null;
      if(rs&&(rs.updatedAt||0)>(S.updatedAt||0)){
        S=normalize(JSON.parse(JSON.stringify(rs)));
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        renderAll();
      } else if(S.updatedAt) flush();
    }catch(e){}
  })();
}
