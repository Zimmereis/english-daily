<title>English Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--FONTS-->
<style>
/* Layout: one narrow column, app-style, bottom tab bar. The flashcard is the visual centre. */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --sunk:#E2EAE7; --ink:#15233A; --muted:#5B6877; --line:#D3DEDA;
  --accent:#D5426C; --accent-soft:#F8DDE5; --mint:#23907B; --mint-soft:#D5EEE8; --ochre:#B07415; --ochre-soft:#F5E6CC;
  --on-accent:#FFFFFF;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161F; --surface:#16212C; --sunk:#1C2935; --ink:#E7EDF1; --muted:#93A2B0; --line:#26343F;
  --accent:#F0698F; --accent-soft:#3B1E2A; --mint:#4CC0A6; --mint-soft:#15332D; --ochre:#E6AE4C; --ochre-soft:#3A2D16;
  --on-accent:#1A0B11; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E161F; --surface:#16212C; --sunk:#1C2935; --ink:#E7EDF1; --muted:#93A2B0; --line:#26343F;
  --accent:#F0698F; --accent-soft:#3B1E2A; --mint:#4CC0A6; --mint-soft:#15332D; --ochre:#E6AE4C; --ochre-soft:#3A2D16;
  --on-accent:#1A0B11; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.streak{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
.streak b{color:var(--ink)}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--line)}
.streak.on .dot-live{background:var(--ochre)}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
section[data-tab]{display:flex;flex-direction:column;gap:16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.due b{color:var(--accent)}
.stat.done b{color:var(--mint)}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:600;font-size:16px;background:var(--sunk);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn svg{width:18px;height:18px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* flashcard */
.fc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px 20px;min-height:300px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px -18px rgba(21,35,58,.35)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.boxes{display:flex;gap:4px;flex:none}
.boxes i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.boxes i.on{background:var(--mint)}
.fc-front{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding:18px 0 6px}
.fc-word{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,8vw,36px);line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere}
.fc-ipa{color:var(--muted);font-size:16px}
.fc-back{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.fc-tr{font-size:21px;font-weight:600}
.fc-ex{font-size:15px}
.fc-ex small{display:block;color:var(--muted);font-size:14px}
.speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink);padding:0}
.speak svg{width:18px;height:18px}
.row-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border:0;border-radius:12px;padding:12px 6px;font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:1px}
.grades button small{font-weight:500;font-size:11px;opacity:.85}
.g-again{background:var(--accent-soft);color:var(--accent)}
.g-hard{background:var(--ochre-soft);color:var(--ochre)}
.g-good{background:var(--mint-soft);color:var(--mint)}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.session-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--muted);font-size:14px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.done-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.done-box h3{font-family:var(--f-display);font-size:20px;margin:0}

details.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.panel summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+";color:var(--muted);font-weight:500}
details.panel[open] summary::after{content:"–"}
.panel-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
.wordlist{display:flex;flex-direction:column}
.wl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;align-items:center}
.wl:first-child{border-top:0}
.wl span:nth-child(2){color:var(--muted)}
.wl .boxes i{width:8px}
.ok-msg{font-size:14px;color:var(--mint)}
.err{font-size:14px;color:var(--accent);margin:0}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* phrases */
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ph{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.ph:first-child{border-top:0}
.ph-txt{flex:1;min-width:0}
.ph-en{font-weight:600}
.ph-ru{color:var(--muted);font-size:14px}
.addc{border:1px solid var(--line);background:transparent;border-radius:999px;height:38px;padding:0 11px;font-size:13px;font-weight:600;flex:none;color:var(--accent)}
.addc[disabled]{color:var(--mint);border-color:var(--mint-soft);background:var(--mint-soft)}

/* grammar */
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;width:100%}
.lesson .n{font-family:var(--f-display);font-weight:600;font-size:14px;width:30px;height:30px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex:none;font-variant-numeric:tabular-nums}
.lesson.ok .n{background:var(--mint);color:var(--surface)}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block}
.lesson .t small{color:var(--muted);font-size:13px}
.lesson .sc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.expl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.expl p{margin:0}
.formula{font-family:var(--f-display);font-size:13.5px;background:var(--sunk);border-radius:8px;padding:10px 12px;line-height:1.7}
.exs{display:flex;flex-direction:column;gap:8px}
.exs div{display:flex;gap:10px;align-items:center}
.exs .speak{width:32px;height:32px}
.exs p{margin:0}
.exs p small{color:var(--muted);display:block;font-size:14px}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.q{font-size:19px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.qfb{font-size:15px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.qfb.good{background:var(--mint-soft)}
.qfb.bad{background:var(--accent-soft)}
.build-line{min-height:52px;border:1px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;background:var(--bg)}
.build-line:empty::before{content:"Нажимай на слова по порядку";color:var(--muted);font-size:14px;padding:6px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:16px;font-weight:500}
.build-line .tok{background:var(--sunk);border-color:transparent}
.tok[disabled]{visibility:hidden}

/* dialogs */
.dlist{display:flex;flex-direction:column;gap:8px}
.ai-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:0;border-radius:var(--r);padding:16px;background:var(--ink);color:var(--bg)}
.ai-card b{display:block;font-size:16px}
.ai-card small{font-size:13px;opacity:.75}
.ai-card .ic{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.ai-card .ic svg{width:20px;height:20px}
.dl{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.line.me{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:10px 14px;border-radius:18px;font-size:16px;overflow-wrap:anywhere;text-align:left;border:1px solid var(--line);background:var(--surface);min-width:0}
.line.a .bub{border-bottom-left-radius:6px}
.line.me .bub{background:var(--ink);color:var(--bg);border-color:var(--ink);border-bottom-right-radius:6px}
.bub .ru{display:block;font-size:14px;opacity:.7;margin-top:4px}
.bub .hidden-en{font-style:italic;opacity:.75}
.line .speak{width:32px;height:32px}
.line.playing .bub{outline:2px solid var(--accent);outline-offset:1px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}

/* AI chat */
.scen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sc-card b{font-size:15px}
.sc-card small{color:var(--muted);font-size:13px;line-height:1.35}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;font-size:16px;overflow-wrap:anywhere}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--ink);color:var(--bg);border-bottom-right-radius:6px;align-self:flex-end}
.msg .ru{color:var(--muted);font-size:14px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.msg-actions{display:flex;gap:6px;margin-top:8px}
.msg-actions button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.msg-actions svg{width:14px;height:14px}
.corr{align-self:flex-end;max-width:88%;background:var(--ochre-soft);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.corr b{color:var(--ochre);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.corr .better{font-weight:600;font-size:15px}
.corr.okc{background:var(--mint-soft)}
.corr.okc b{color:var(--mint)}
.thinking{align-self:flex-start;color:var(--muted);font-size:14px;padding:6px 4px}
.thinking::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.comp-row{display:flex;gap:8px;align-items:flex-end}
.comp-row textarea{flex:1;min-width:0;resize:none;min-height:46px;max-height:140px}
.hintbox{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 8px);background:var(--accent);color:var(--on-accent);font-size:10px;border-radius:999px;padding:0 5px;line-height:16px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">English<span>.</span>Daily</div>
    <div class="streak" id="streak"><i class="dot-live"></i><span id="streakTxt">—</span></div>
  </header>
  <section data-tab="words" id="tab-words"></section>
  <section data-tab="grammar" id="tab-grammar" hidden></section>
  <section data-tab="phrases" id="tab-phrases" hidden></section>
  <section data-tab="dialogs" id="tab-dialogs" hidden></section>
</div>

<nav class="tabs" aria-label="Разделы">
  <div class="in">
    <button data-go="words" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="15" rx="2.5"/><path d="M7 3h11.5A2.5 2.5 0 0 1 21 5.5V17"/></svg>Слова<span class="badge" id="dueBadge" hidden></span></button>
    <button data-go="grammar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0 0 4h12"/><path d="M8 8h6M8 12h4"/></svg>Грамматика</button>
    <button data-go="phrases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>Фразы</button>
    <button data-go="dialogs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>Диалоги</button>
  </div>
</nav>

<script>
/*CONTENT*/

/* ---------------- STATE ---------------- */
const IS_APP = !!window.AndroidTTS;
const WORDS = WORDS_RAW.trim().split("\n").map(l=>{const [cat,en,ipa,ru,ex,exru]=l.split("|");return {id:"w:"+en,en,ipa,ru,ex,exru,cat}});
const CAT_NAMES = Object.fromEntries([["my","Мои слова"],...WORD_CATS]);
const INT = [0,1,3,7,14,30,60];
const KEY = "english-daily-v1";
const today = ()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const blank = ()=>({v:2,cards:{},custom:[],grammar:{},newDay:0,newCount:0,days:[],dir:"en",perDay:10,topic:"all",updatedAt:0});
function normalize(s){
  const b=blank();s=Object.assign(b,s||{});
  if(!Array.isArray(s.custom))s.custom=[];if(!Array.isArray(s.days))s.days=[];
  if(typeof s.cards!=="object"||!s.cards)s.cards={};if(typeof s.grammar!=="object"||!s.grammar)s.grammar={};
  if(s.v<2){s.grammar={};s.v=2} /* lessons were renumbered */
  if(![5,10,15,20].includes(s.perDay))s.perDay=10;
  return s;
}
let S = blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=normalize(JSON.parse(raw))}catch(e){}

let remoteRef=null, saveTimer=null, writing=false, again=false;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(remoteRef){clearTimeout(saveTimer);saveTimer=setTimeout(flush,1500)}
}
async function flush(){
  if(!remoteRef)return;
  if(writing){again=true;return}
  writing=true;
  try{await remoteRef.set({state:JSON.parse(JSON.stringify(S))})}catch(e){}
  writing=false;
  if(again){again=false;flush()}
}
function markDay(){const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-120)}}
function streak(){const set=new Set(S.days);let t=today();if(!set.has(t))t--;let n=0;while(set.has(t)){n++;t--}return {n,todayDone:set.has(today())}}

const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SPK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>`;
const sayText = t=>String(t).replace(/\s*\/\s*/g,". ").replace(/…/g,"");

/* ---------------- SPEECH ---------------- */
let webVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();webVoice=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{if(!IS_APP&&window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
function utter(text,pitch){const u=new SpeechSynthesisUtterance(sayText(text));u.lang="en-US";u.rate=.88;if(pitch)u.pitch=pitch;if(webVoice)u.voice=webVoice;return u}
function speak(text){
  try{
    if(IS_APP){window.AndroidTTS.speak(sayText(text));return}
    if(!window.speechSynthesis)return;speechSynthesis.cancel();speechSynthesis.speak(utter(text));
  }catch(e){}
}
function stopSpeech(){try{if(IS_APP)window.AndroidTTS.stop();else if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
/* plays lines one after another; onLine(i) highlights the current one */
let playToken=0;
function speakSeq(items,onLine,onDone){
  const my=++playToken;stopSpeech();
  if(IS_APP){
    try{items.forEach((it,i)=>{i===0?window.AndroidTTS.speak(sayText(it.text)):window.AndroidTTS.add(sayText(it.text))})}catch(e){}
    onDone&&onDone();return;
  }
  if(!window.speechSynthesis){onDone&&onDone();return}
  let i=0;
  const next=()=>{
    if(my!==playToken)return;
    if(i>=items.length){onLine&&onLine(-1);onDone&&onDone();return}
    const it=items[i];onLine&&onLine(i);
    const u=utter(it.text,it.pitch);u.onend=()=>{i++;next()};u.onerror=()=>{i++;next()};
    try{speechSynthesis.speak(u)}catch(e){i++;next()}
  };
  next();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.preventDefault();e.stopPropagation();playToken++;speak(b.getAttribute("data-say"))}});
const boxes=(b,n=6)=>`<span class="boxes" aria-label="Уровень ${b} из ${n}">${Array.from({length:n},(_,i)=>`<i class="${i<b?"on":""}"></i>`).join("")}</span>`;
const spkBtn=(t,label="Озвучить")=>`<button class="speak" data-say="${esc(t)}" aria-label="${label}">${SPK}</button>`;

/* ---------------- HEADER / TABS ---------------- */
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
function renderHeader(){
  const st=streak();
  document.getElementById("streak").classList.toggle("on",st.todayDone);
  document.getElementById("streakTxt").innerHTML = st.n? `<b>${st.n}</b> ${plural(st.n,"день","дня","дней")} подряд` : "Начни серию сегодня";
  const due=countDue();const bd=document.getElementById("dueBadge");bd.hidden=!due;bd.textContent=due;
}
let TAB="words";
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
function go(t){
  TAB=t;playToken++;stopSpeech();
  document.querySelectorAll("section[data-tab]").forEach(s=>s.hidden=s.dataset.tab!==t);
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.go===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  window.scrollTo({top:0});
}
/* Android back button: returns true when the app handled it */
window.__back=function(){
  playToken++;stopSpeech();
  if(TAB==="words"&&SES){SES=null;renderWords();return true}
  if(TAB==="grammar"&&LES){LES=null;renderGrammar();window.scrollTo({top:0});return true}
  if(TAB==="dialogs"&&(DLG!==null||CH||CHPICK)){DLG=null;CH=null;CHPICK=false;renderDialogs();window.scrollTo({top:0});return true}
  if(TAB!=="words"){go("words");return true}
  return false;
};

/* ---------------- WORDS ---------------- */
const deck=()=>[...S.custom,...WORDS];
function countDue(){const t=today();return deck().filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t).length}
function newLeft(){return S.newDay===today()?Math.max(0,S.perDay-S.newCount):S.perDay}
function freshPool(){const all=deck().filter(c=>!S.cards[c.id]);if(S.topic==="all")return all;const f=all.filter(c=>c.cat===S.topic);return f}
let SES=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startSession(){
  const t=today();
  const due=shuffle(deck().filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t));
  const fresh=freshPool().slice(0,newLeft());
  SES={queue:[...due,...fresh],i:0,total:due.length+fresh.length,shown:false,good:0};
  renderWords();
}
function grade(g){
  const c=SES.queue[SES.i];const t=today();const st=S.cards[c.id];
  if(!st){if(S.newDay!==t){S.newDay=t;S.newCount=0}S.newCount++}
  let b=st?st.b:0,due;
  if(g==="again"){b=0;due=t;SES.queue.push(c)}
  else if(g==="hard"){b=Math.max(1,b);due=t+1}
  else {b=Math.min(6,b+1);due=t+INT[b];SES.good++}
  S.cards[c.id]={b,due};
  markDay();save();
  SES.i++;SES.shown=false;
  renderWords();renderHeader();window.scrollTo({top:0});
}
function fmtInt(b){const d=INT[b];return d===1?"через день":`через ${d} ${plural(d,"день","дня","дней")}`}
function renderWords(){
  const el=document.getElementById("tab-words");
  if(SES&&SES.i<SES.queue.length){
    const c=SES.queue[SES.i];const st=S.cards[c.id];const ru=S.dir==="ru";
    const pct=Math.min(100,Math.round(SES.i/Math.max(SES.queue.length,1)*100));
    const enBlock=`<div class="row-inline"><div class="fc-word">${esc(c.en)}</div>${spkBtn(c.en)}</div>${c.ipa?`<div class="fc-ipa">[${esc(c.ipa)}]</div>`:""}`;
    const front = ru? `<div class="fc-word">${esc(c.ru)}</div><div class="fc-ipa">Как это по-английски?</div>` : enBlock;
    const back = ru? enBlock.replace("fc-word","fc-tr") : `<div class="fc-tr">${esc(c.ru)}</div>`;
    const ex = c.ex? `<div class="row-inline" style="flex-wrap:nowrap">${spkBtn(c.ex,"Озвучить пример")}<div class="fc-ex">${esc(c.ex)}<small>${esc(c.exru||"")}</small></div></div>`:"";
    el.innerHTML=`
      <div class="session-head"><span>${SES.i+1} / ${SES.queue.length}</span><button class="linkbtn" id="endSes">Закончить</button></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="fc">
        <div class="fc-top"><span class="tag ${st?"":"new"}">${st?"Повторение":"Новое слово"} · ${esc(CAT_NAMES[c.cat]||"")}</span>${boxes(st?st.b:0)}</div>
        <div class="fc-front">${front}</div>
        <div class="fc-back" ${SES.shown?"":"hidden"}>${back}${ex}</div>
      </div>
      ${SES.shown? `<div class="grades">
          <button class="g-again" data-g="again">Не помню<small>ещё раз сегодня</small></button>
          <button class="g-hard" data-g="hard">Трудно<small>завтра</small></button>
          <button class="g-good" data-g="good">Помню<small>${fmtInt(Math.min(6,(st?st.b:0)+1))}</small></button></div>`
        : `<button class="btn primary block" id="reveal">Показать ответ</button>`}`;
    el.querySelector("#endSes").onclick=()=>{SES=null;renderWords()};
    const rv=el.querySelector("#reveal");if(rv)rv.onclick=()=>{SES.shown=true;renderWords();if(ru)speak(c.en)};
    el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(b.dataset.g));
    if(!ru&&!SES.shown&&SES.autoSaid!==SES.i){SES.autoSaid=SES.i;speak(c.en)}
    return;
  }
  if(SES&&SES.total>0){
    el.innerHTML=`<div class="done-box"><h3>Готово на сегодня</h3><p class="sub">Карточек пройдено: ${SES.total}. Сразу вспомнила: ${SES.good}. Забытые слова вернутся завтра — так они запоминаются лучше, чем если зубрить подряд.</p><button class="btn ghost" id="back">К словам</button></div>`;
    el.querySelector("#back").onclick=()=>{SES=null;renderWords()};
    return;
  }
  SES=null;
  const all=deck();const due=countDue();const nl=Math.min(newLeft(),freshPool().length);
  const learned=all.filter(c=>S.cards[c.id]&&S.cards[c.id].b>=3).length;
  const can=due+nl;
  const topicOpts=[["all","Все темы по порядку"],...WORD_CATS.filter(([k])=>WORDS.some(w=>w.cat===k)),...(S.custom.length?[["my","Мои слова"]]:[])];
  el.innerHTML=`
    <div><h2>Слова</h2><p class="sub">Карточки с повторением по интервалам: слова, которые помнишь, показываются всё реже, а забытые — чаще. ${S.perDay} новых слов в день.</p></div>
    <div class="stats">
      <div class="stat due"><b>${due}</b><span>повторить</span></div>
      <div class="stat"><b>${nl}</b><span>новых сегодня</span></div>
      <div class="stat done"><b>${learned}</b><span>выучено из ${all.length}</span></div>
    </div>
    <div class="seg" role="group" aria-label="Направление">
      <button data-dir="en" aria-pressed="${S.dir!=="ru"}">English → русский</button>
      <button data-dir="ru" aria-pressed="${S.dir==="ru"}">Русский → English</button>
    </div>
    <button class="btn primary block" id="start" ${can?"":"disabled"}>${can?`Начать · ${can} ${plural(can,"карточка","карточки","карточек")}`:"На сегодня всё повторено"}</button>
    <details class="panel" id="setPanel">
      <summary>Настройки</summary>
      <div class="panel-body">
        <div class="field"><label for="setTopic">Откуда брать новые слова</label>
          <select id="setTopic">${topicOpts.map(([k,n])=>`<option value="${k}" ${S.topic===k?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
        <div class="field"><label>Новых слов в день</label>
          <div class="seg" role="group">${[5,10,15,20].map(n=>`<button data-per="${n}" aria-pressed="${S.perDay===n}">${n}</button>`).join("")}</div></div>
      </div>
    </details>
    <details class="panel" id="addPanel">
      <summary>Добавить своё слово</summary>
      <form class="panel-body" id="addForm">
        <div class="field"><label for="addEn">По-английски</label><input id="addEn" autocomplete="off" required placeholder="например: sunset"></div>
        <div class="field"><label for="addRu">Перевод</label><input id="addRu" autocomplete="off" required placeholder="закат"></div>
        <div class="field"><label for="addEx">Пример (необязательно)</label><input id="addEx" autocomplete="off" placeholder="The sunset is beautiful today."></div>
        <button class="btn primary" type="submit">Добавить в карточки</button>
        <p class="err" id="addMsg" hidden></p>
      </form>
    </details>
    <details class="panel" id="listPanel">
      <summary>Все слова · ${all.length}</summary>
      <div class="panel-body">${groupList(all)}</div>
    </details>`;
  el.querySelector("#start").onclick=startSession;
  el.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{S.dir=b.dataset.dir;save();renderWords()});
  el.querySelector("#setTopic").onchange=e=>{S.topic=e.target.value;save();renderWords();document.getElementById("setPanel").open=true};
  el.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{S.perDay=+b.dataset.per;save();renderWords();document.getElementById("setPanel").open=true});
  el.querySelector("#addForm").onsubmit=e=>{
    e.preventDefault();
    const en=el.querySelector("#addEn").value.trim(),ru=el.querySelector("#addRu").value.trim(),ex=el.querySelector("#addEx").value.trim();
    const msg=el.querySelector("#addMsg");
    if(!en||!ru)return;
    if(deck().some(c=>c.en.toLowerCase()===en.toLowerCase())){msg.hidden=false;msg.textContent="Это слово уже есть в карточках.";return}
    S.custom.unshift({id:"c:"+Date.now().toString(36),en,ru,ipa:"",ex,exru:"",cat:"my"});save();renderWords();renderHeader();
    document.getElementById("addPanel").open=true;
    const m=document.getElementById("addMsg");m.hidden=false;m.className="ok-msg";m.textContent=`«${en}» добавлено. Чтобы учить сначала свои слова, выбери в настройках «Мои слова».`;
  };
}
function groupList(all){
  const groups={};all.forEach(c=>{(groups[c.cat]=groups[c.cat]||[]).push(c)});
  const order=["my",...WORD_CATS.map(x=>x[0])].filter(k=>groups[k]);
  return order.map(k=>`<div class="label" style="margin-top:6px">${esc(CAT_NAMES[k]||k)} · ${groups[k].length}</div><div class="wordlist">${groups[k].map(c=>`<div class="wl"><span>${esc(c.en)}</span><span>${esc(c.ru)}</span>${boxes(S.cards[c.id]?S.cards[c.id].b:0)}</div>`).join("")}</div>`).join("");
}

/* ---------------- GRAMMAR ---------------- */
let LES=null;
const lessonDone=i=>(S.grammar[i]||0)>=LESSONS[i].q.length-1;
function newBuild(item){
  const words=item.b.split(" ");let pool=words.map((w,i)=>({w,i}));
  if(words.length>1){let tries=0;do{shuffle(pool);tries++}while(tries<10&&pool.every((p,k)=>p.i===k))}
  return {pool,picked:[]};
}
function startLesson(i){LES={i,qi:0,picked:null,score:0,bd:null};prepQ();renderGrammar();window.scrollTo({top:0})}
function prepQ(){const L=LESSONS[LES.i];const it=L.q[LES.qi];LES.picked=null;LES.bd=(it&&!Array.isArray(it))?newBuild(it):null}
function finishQ(correct){if(correct)LES.score++}
function renderGrammar(){
  const el=document.getElementById("tab-grammar");
  if(LES){
    const L=LESSONS[LES.i];const total=L.q.length;
    let quiz;
    if(LES.qi<total){
      const it=L.q[LES.qi];
      const head=`<div class="label">Задание ${LES.qi+1} из ${total}</div>`;
      const nextBtn=`<button class="btn primary block" id="nextQ">${LES.qi+1<total?"Дальше":"Результат"}</button>`;
      if(Array.isArray(it)){
        const [q,opts,ans,why]=it;
        quiz=`<div class="quiz">${head}<div class="q">${esc(q)}</div>
          <div class="opts">${opts.map((o,k)=>{let cls="";if(LES.picked!=null){if(k===ans)cls="right";else if(k===LES.picked)cls="wrong"}return `<button class="opt ${cls}" data-o="${k}" ${LES.picked!=null?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
          ${LES.picked!=null?`<div class="qfb ${LES.picked===ans?"good":"bad"}">${LES.picked===ans?"Верно. ":"Не совсем. "}${esc(why)}</div>${nextBtn}`:""}</div>`;
      } else {
        const bd=LES.bd;const done=LES.picked!=null;
        const words=it.b.split(" ");
        quiz=`<div class="quiz">${head}<div class="q">Собери фразу: «${esc(it.ru)}»</div>
          <div class="build-line" id="bline">${bd.picked.map((pi,k)=>`<button class="tok" data-un="${k}" ${done?"disabled style='visibility:visible'":""}>${esc(bd.pool[pi].w)}</button>`).join("")}</div>
          ${done?"":`<div class="pool">${bd.pool.map((p,pi)=>`<button class="tok" data-pk="${pi}" ${bd.picked.includes(pi)?"disabled":""}>${esc(p.w)}</button>`).join("")}</div>`}
          ${done?`<div class="qfb ${LES.picked?"good":"bad"}">${LES.picked?"Верно!":"Правильно так:"} <b>${esc(it.b)}</b> ${spkBtn(it.b)}</div>${nextBtn}`
                :`<div class="row-inline"><button class="btn primary" id="checkB" ${bd.picked.length===words.length?"":"disabled"}>Проверить</button><button class="btn ghost" id="resetB" ${bd.picked.length?"":"disabled"}>Сбросить</button></div>`}
        </div>`;
      }
    } else {
      const best=S.grammar[LES.i]||0;
      const full=LES.score===total;
      quiz=`<div class="done-box"><h3>${LES.score} из ${total}</h3><p class="sub">${full?"Тема освоена.":LES.score>=total-1?"Почти идеально — тема засчитана.":LES.score>=total-3?"Неплохо. Перечитай правило и пройди ещё раз — закрепится.":"Перечитай правило и примеры вслух, потом попробуй снова."} Лучший результат: ${best} из ${total}.</p>
        <div class="row-inline"><button class="btn ghost" id="retry">Пройти снова</button>${LES.i+1<LESSONS.length?`<button class="btn primary" id="nextL">Следующая тема</button>`:""}</div></div>`;
    }
    el.innerHTML=`
      <button class="linkbtn" id="backL" style="align-self:flex-start">← Все темы</button>
      <div><div class="label">Тема ${LES.i+1} из ${LESSONS.length}</div><h2>${esc(L.t)}</h2></div>
      <div class="expl">${L.ex.map(p=>`<p>${esc(p)}</p>`).join("")}<div class="formula">${L.f}</div>
        <div class="exs">${L.e.map(s=>{const [en,ru]=s.split("|");return `<div>${spkBtn(en)}<p>${esc(en)}<small>${esc(ru)}</small></p></div>`}).join("")}</div></div>
      ${quiz}`;
    el.querySelector("#backL").onclick=()=>{LES=null;renderGrammar();window.scrollTo({top:0})};
    el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{LES.picked=+b.dataset.o;finishQ(LES.picked===L.q[LES.qi][2]);renderGrammar()});
    el.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{LES.bd.picked.push(+b.dataset.pk);renderGrammar()});
    el.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{LES.bd.picked.splice(+b.dataset.un,1);renderGrammar()});
    const rb=el.querySelector("#resetB");if(rb)rb.onclick=()=>{LES.bd.picked=[];renderGrammar()};
    const cb=el.querySelector("#checkB");if(cb)cb.onclick=()=>{
      const it=L.q[LES.qi];const got=LES.bd.picked.map(pi=>LES.bd.pool[pi].w).join(" ");
      const norm=s=>s.toLowerCase().replace(/[.,!?]/g,"").trim();
      const ok=norm(got)===norm(it.b);LES.picked=ok;finishQ(ok);renderGrammar();speak(it.b)};
    const nq=el.querySelector("#nextQ");if(nq)nq.onclick=()=>{LES.qi++;
      if(LES.qi>=total){S.grammar[LES.i]=Math.max(S.grammar[LES.i]||0,LES.score);markDay();save();renderHeader()}
      else prepQ();
      renderGrammar();
      const qq=document.querySelector("#tab-grammar .quiz, #tab-grammar .done-box");if(qq)qq.scrollIntoView({block:"nearest"})};
    const rt=el.querySelector("#retry");if(rt)rt.onclick=()=>startLesson(LES.i);
    const nl=el.querySelector("#nextL");if(nl)nl.onclick=()=>startLesson(LES.i+1);
    return;
  }
  const done=LESSONS.filter((_,i)=>lessonDone(i)).length;
  const nextI=LESSONS.findIndex((_,i)=>!lessonDone(i));
  el.innerHTML=`
    <div><h2>Грамматика</h2><p class="sub">${LESSONS.length} тем от самых основ до уровня A2 — проходи по порядку. В каждой: короткое правило, примеры с озвучкой и 7 заданий. Освоено: ${done} из ${LESSONS.length}.</p></div>
    ${nextI>=0?`<button class="btn primary block" id="contL">${done?"Продолжить":"Начать"}: ${esc(LESSONS[nextI].t)}</button>`:""}
    <div class="lessons">${LESSONS.map((L,i)=>{const sc=S.grammar[i];
      return `<button class="lesson ${lessonDone(i)?"ok":""}" data-l="${i}"><span class="n">${i+1}</span><span class="t"><b>${esc(L.t)}</b><small>${esc(L.s)}</small></span><span class="sc">${sc!=null?`${sc}/${L.q.length}`:""}</span></button>`}).join("")}</div>`;
  el.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>startLesson(+b.dataset.l));
  const cl=el.querySelector("#contL");if(cl)cl.onclick=()=>startLesson(nextI);
}

    <div><h2>Фразы</h2><p class="sub">Готовые фразы на каждый день. Нажми на динамик, послушай и повтори вслух. Нужную фразу можно отправить в карточки.</p></div>
    <div class="chips" role="group" aria-label="Темы">${PHRASES.map((p,i)=>`<button class="chip" data-pc="${i}" aria-pressed="${i===PCAT}">${esc(p.cat)}</button>`).join("")}</div>
    <div class="plist">${cat.items.map(s=>{const [en,ru]=s.split("|");const added=deck().some(c=>c.en===en);
      return `<div class="ph">${spkBtn(en)}<div class="ph-txt"><div class="ph-en">${esc(en)}</div><div class="ph-ru">${esc(ru)}</div></div><button class="addc" data-add="${esc(s)}" ${added?"disabled":""}>${added?"В карточках":"+ Карточка"}</button></div>`}).join("")}</div>`;
  el.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{PCAT=+b.dataset.pc;renderPhrases()});
  el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const [en,ru]=b.dataset.add.split("|");

    b.disabled=true;b.textContent="В карточках";renderHeader();if(!SES)renderWords()});
}

/* ---------------- DIALOGS ---------------- */

  const el=document.getElementById("tab-dialogs");
  if(CH||CHPICK){renderChat();return}
  if(DLG===null){
    el.innerHTML=`
      <div><h2>Диалоги</h2><p class="sub">Короткие сценки из жизни. Слушай целиком, потом включай «Тренировку»: твои реплики спрячутся, и нужно вспомнить их самой.</p></div>
      ${SAMPLE?`<button class="ai-card" id="openAI"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span><span><b>Разговор с ИИ</b><small>Свободный диалог по ролям с исправлением ошибок</small></span></button>`:""}
      <div class="lessons">${DIALOGS.map((d,i)=>`<button class="lesson" data-d="${i}"><span class="n">${i+1}</span><span class="t"><b>${esc(d.t)}</b><small>${esc(d.d)}</small></span></button>`).join("")}</div>`;
    el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{DLG=+b.dataset.d;DOPT.shown={};PLAYING=-1;renderDialogs();window.scrollTo({top:0})});
    const ai=el.querySelector("#openAI");if(ai)ai.onclick=()=>{CHPICK=true;renderDialogs();window.scrollTo({top:0})};
    return;
  }
  const D=DIALOGS[DLG];
  el.innerHTML=`
    <button class="linkbtn" id="backD" style="align-self:flex-start">← Все диалоги</button>
    <div><div class="label">Диалог ${DLG+1}</div><h2>${esc(D.t)}</h2></div>
    <div class="toolbar">
      <button class="btn primary small" id="playAll">${SPK}Слушать весь</button>
      <button class="btn ghost small" id="tgRu" aria-pressed="${DOPT.ru}">${DOPT.ru?"Скрыть перевод":"Перевод"}</button>
      <button class="btn ghost small" id="tgPr" aria-pressed="${DOPT.practice}">${DOPT.practice?"Выйти из тренировки":"Тренировка"}</button>
    </div>
    ${DOPT.practice?`<p class="sub">Твои реплики спрятаны. Прочитай перевод, скажи фразу вслух по-английски и нажми на неё, чтобы проверить.</p>`:""}
    <div class="dl">${D.l.map(([who,en,ru],i)=>{
      const hide=DOPT.practice&&who==="me"&&!DOPT.shown[i];
      const body= hide? `<span class="hidden-en">${esc(ru)}</span><span class="ru">Нажми, чтобы проверить</span>`
                      : `${esc(en)}${(DOPT.ru||(DOPT.practice&&who==="me"))?`<span class="ru">${esc(ru)}</span>`:""}`;
      return `<div class="line ${who} ${PLAYING===i?"playing":""}" data-li="${i}">${hide?"":spkBtn(en)}<button class="bub" data-reveal="${i}">${body}</button></div>`}).join("")}</div>
    ${DLG+1<DIALOGS.length?`<button class="btn ghost block" id="nextD">Следующий диалог: ${esc(DIALOGS[DLG+1].t)}</button>`:""}`;
  el.querySelector("#backD").onclick=()=>{playToken++;stopSpeech();DLG=null;renderDialogs();window.scrollTo({top:0})};
  el.querySelector("#tgRu").onclick=()=>{DOPT.ru=!DOPT.ru;renderDialogs()};
  el.querySelector("#tgPr").onclick=()=>{DOPT.practice=!DOPT.practice;DOPT.shown={};renderDialogs()};
  el.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{const i=+b.dataset.reveal;const [who,en]=D.l[i];
    if(DOPT.practice&&who==="me"&&!DOPT.shown[i]){DOPT.shown[i]=true;markDay();save();renderHeader();renderDialogs()}
    playToken++;speak(en)});
  el.querySelector("#playAll").onclick=()=>{
    const items=D.l.map(([who,en])=>({text:en,pitch:who==="me"?1.15:0.9}));
    speakSeq(items,i=>{PLAYING=i;document.querySelectorAll("#tab-dialogs .line").forEach(n=>n.classList.toggle("playing",+n.dataset.li===i))},()=>{PLAYING=-1});
    markDay();save();renderHeader();
  };
  const nd=el.querySelector("#nextD");if(nd)nd.onclick=()=>{playToken++;stopSpeech();DLG++;DOPT.shown={};renderDialogs();window.scrollTo({top:0})};
}

/* ---------------- AI CHAT (only inside Claude) ---------------- */
let SAMPLE=null, CH=null, CHPICK=false, AUTO_SPEAK=true;
function rulesFor(sc){
  return `You are an English conversation partner for a Russian-speaking learner at a beginner level (A1-A2, knows basic English).
Scenario: ${sc.role}
Rules:
- Use very simple English: short sentences, common everyday words, 1-2 sentences per reply. Ask one simple question at a time so the conversation keeps going. Stay in your role.
- If the learner writes in Russian or mixes languages, keep the conversation going and show them in "better" how to say it in English.
- Corrections are about the learner's LAST message only. Explain mistakes briefly and kindly in Russian (1-2 sentences). Ignore missing capital letters and final punctuation.
Reply with ONLY a JSON object, no other text:
{"reply": "your reply in English", "reply_ru": "Russian translation of your reply", "correction": "short explanation of mistakes in Russian, or empty string if there were none or there is no learner message yet", "better": "the learner's last message rewritten in correct natural English, or empty string if it was already correct or there is no learner message yet", "hint": "one short example of what the learner could answer next, in simple English"}`;
}
async function askTutor(){
  if(!SAMPLE)return;
  CH.busy=true;CH.err="";renderChat();
  const input=[{role:"user",content:rulesFor(CH.sc)}];
  const turns=CH.turns.slice(-20);
  if(turns.length===0)input.push({role:"user",content:"(Start the conversation now.)"});else input.push(...turns);
  try{
    const r=await SAMPLE.json(input,{cache:false,modelTier:"quick"});
    const reply=String(r&&r.reply||"").trim();
    if(!reply)throw {code:"invalid_json"};
    const lastMe=[...CH.view].reverse().find(m=>m.me);
    if(lastMe&&!lastMe.checked){lastMe.checked=true;lastMe.corr=String(r.correction||"").trim();lastMe.better=String(r.better||"").trim()}
    CH.view.push({me:false,text:reply,ru:String(r.reply_ru||"").trim(),showRu:false});
    CH.turns.push({role:"assistant",content:reply});
    CH.hint=String(r.hint||"").trim();CH.showHint=false;
    markDay();save();renderHeader();
    if(AUTO_SPEAK)speak(reply);
  }catch(e){
    const c=e&&e.code;
    if(e&&e.ru){CH.err=e.ru;if(e.fatal)SAMPLE=null}
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){SAMPLE=null;CH.err="Разговор с ИИ недоступен: доступ к Claude для этой страницы не разрешён."}
    else if(c==="rate_limited")CH.err="Слишком много сообщений подряд или закончился лимит. Подожди немного и отправь снова.";
    else if(c==="session_expired")CH.err="Сессия истекла — войди в Claude заново.";
    else CH.err="Не получилось получить ответ. Нажми «Отправить» ещё раз.";
  }
  CH.busy=false;renderChat();
}
function renderChat(){
  const el=document.getElementById("tab-dialogs");
  if(!CH){
    el.innerHTML=`<button class="linkbtn" id="backC" style="align-self:flex-start">← Диалоги</button>
      <div><h2>Разговор с ИИ</h2><p class="sub">Выбери ситуацию — ИИ сыграет роль и будет поправлять ошибки по-русски. Пиши как получается, можно вперемешку с русским.</p></div>
      <div class="scen">${SCENARIOS.map((s,i)=>`<button class="sc-card" data-sc="${i}"><b>${esc(s.t)}</b><small>${esc(s.d)}</small></button>`).join("")}</div>`;
    el.querySelector("#backC").onclick=()=>{CHPICK=false;renderDialogs()};
    el.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{if(!SAMPLE)return;CH={sc:SCENARIOS[+b.dataset.sc],turns:[],view:[],busy:false,hint:"",showHint:false,err:""};askTutor()});
    return;
  }
  const draft=(document.getElementById("msgIn")||{}).value||"";
  const parts=[];
  CH.view.forEach((m,i)=>{
    if(m.me){
      parts.push(`<div class="msg me">${esc(m.text)}</div>`);
      if(m.checked){
        if(m.better||m.corr)parts.push(`<div class="corr"><b>Как лучше</b>${m.better?`<div class="better">${esc(m.better)}</div>`:""}${m.corr?`<div>${esc(m.corr)}</div>`:""}</div>`);
        else parts.push(`<div class="corr okc"><b>Без ошибок</b></div>`);
      }
    } else parts.push(`<div class="msg ai">${esc(m.text)}${m.showRu&&m.ru?`<div class="ru">${esc(m.ru)}</div>`:""}<div class="msg-actions"><button data-say="${esc(m.text)}">${SPK}Слушать</button>${m.ru?`<button data-ru="${i}">${m.showRu?"Скрыть перевод":"Перевод"}</button>`:""}</div></div>`);
  });
  if(CH.busy)parts.push(`<div class="thinking">Печатает</div>`);
  el.innerHTML=`
    <div class="row-inline" style="justify-content:space-between"><div><div class="label">Ситуация</div><h2 style="margin:0">${esc(CH.sc.t)}</h2></div><button class="btn ghost small" id="endChat">Сменить</button></div>
    <div class="chat" id="chatLog">${parts.join("")}</div>
    ${CH.err?`<p class="err">${esc(CH.err)}</p>`:""}
    <div class="composer">
      ${CH.hint&&CH.showHint?`<div class="hintbox"><span>${esc(CH.hint)}</span><button class="btn small ghost" id="useHint">Вставить</button></div>`:""}
      <div class="comp-row">
        <textarea id="msgIn" rows="1" placeholder="Напиши по-английски…" ${CH.busy||!SAMPLE?"disabled":""}>${esc(draft)}</textarea>
        <button class="btn primary" id="sendBtn" ${CH.busy||!SAMPLE?"disabled":""} aria-label="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="row-inline" style="justify-content:space-between">
        ${CH.hint?`<button class="linkbtn" id="hintBtn">${CH.showHint?"Скрыть подсказку":"Подсказка: что ответить"}</button>`:"<span></span>"}
        <label class="row-inline" style="gap:6px;font-size:14px;color:var(--muted)"><input type="checkbox" id="autoSp" ${AUTO_SPEAK?"checked":""}> Озвучивать ответы</label>
      </div>
    </div>`;
  el.querySelector("#endChat").onclick=()=>{CH=null;renderChat()};
  el.querySelectorAll("[data-ru]").forEach(b=>b.onclick=()=>{const m=CH.view[+b.dataset.ru];m.showRu=!m.showRu;renderChat()});
  const inp=el.querySelector("#msgIn");
  const send=()=>{const v=inp.value.trim();if(!v||CH.busy)return;CH.view.push({me:true,text:v});CH.turns.push({role:"user",content:v});inp.value="";CH.showHint=false;askTutor()};
  el.querySelector("#sendBtn").onclick=send;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
  inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,140)+"px"});
  const hb=el.querySelector("#hintBtn");if(hb)hb.onclick=()=>{CH.showHint=!CH.showHint;renderChat()};
  const uh=el.querySelector("#useHint");if(uh)uh.onclick=()=>{const h=CH.hint;CH.showHint=false;renderChat();const i3=document.getElementById("msgIn");i3.value=h;i3.focus()};
  el.querySelector("#autoSp").onchange=e=>{AUTO_SPEAK=e.target.checked};
  const last=el.querySelector("#chatLog").lastElementChild;if(last&&TAB==="dialogs")last.scrollIntoView({block:"nearest"});
}

/* ---------------- BOOT ---------------- */
function renderAll(){renderHeader();if(!SES)renderWords();if(!LES)renderGrammar();renderPhrases();if(!CH)renderDialogs()}
renderAll();

if(!IS_APP&&window.claude&&window.claude.use){
  claude.use("sample").then(s=>{SAMPLE=s||null;if(!CH&&!CHPICK&&DLG===null)renderDialogs()}).catch(()=>{});
  (async()=>{
    try{
      const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
      if(!user||!db)return;
      const id=await user.id();if(!id)return;
      const ref=db.doc("data/users/"+id+"/progress");
      const snap=await ref.get();
      remoteRef=ref;
      const rs=snap.exists?(snap.data()||{}).state:null;
      if(rs&&(rs.updatedAt||0)>(S.updatedAt||0)){
        S=normalize(JSON.parse(JSON.stringify(rs)));
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        renderAll();
      } else if(S.updatedAt) flush();
    }catch(e){}
  })();
}
