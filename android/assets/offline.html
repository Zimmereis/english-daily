<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Daily</title>
<style>:root{--bg:#FFF5E8;--ink:#2B1D3F;--muted:#7D6C8A;--grape:#7856F5;--grape-d:#5434D2}
@media (prefers-color-scheme:dark){:root{--bg:#17112A;--ink:#FBF6FF;--muted:#B5A8CE;--grape:#8E72FF;--grape-d:#5B3CD6}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:600 16px/1.45 ui-rounded,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}

button{margin-top:10px;border:0;border-radius:18px;background:var(--grape);color:#fff;font:900 17px system-ui,sans-serif;padding:16px 28px;box-shadow:0 5px 0 var(--grape-d);width:100%}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--grape-d)}
.mascot.bob{animation:bob 3.4s ease-in-out infinite;transform-origin:50% 95%}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}</style></head>
